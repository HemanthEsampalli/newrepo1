apiVersion: v1
kind: Pod
metadata:
  name: mypod
  labels:
    env: dev
spec:
  containers:
    - name: stress
      image: progrium/stress:latest
      command: ["stress", "--vm", "1", "--vm-bytes", "500M"]
      ports:
        - containerPort: 80
          protocol: TCP
      resources:
        requests:
          cpu: "200m"
          memory: "200Mi"
        limits:
          cpu: "200m"
          memory: "250Mi"
