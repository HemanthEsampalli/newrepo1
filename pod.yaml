apiVersion : v1
kind : Pod
metadata : 
  name : mypod
  labels : 
    env : dev
spec :
  containers :
    - name : stress
      image : progrium/stress:latest
      ports :
        - containers : 80
          protocol : TCP
          command : ["--vm", "2", "--vm-bytes", "125M"]
resources :
  requests :
    cpu : 150M
    memory : 100mi
  limits : 
  cpu : 200M
  memory : 150Mi