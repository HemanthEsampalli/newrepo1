apiVersion: v1
kind: Pod
metadata:
  name: mypod
  labels:
    env: dev
spec:
  containers:
    - name: stress
      image: progrium/stress:latest
      command: ["--vm", "1", "--vm-bytes", "200M"]
      ports:
        - containerPort: 80
          protocol: TCP
      resources:
        requests:
          cpu: "150m"
          memory: "100Mi"
        limits:
          cpu: "200m"
          memory: "150Mi"
